<!doctype html><html><body style="margin:0;background:#222;overflow:hidden;cursor:pointer">
<canvas id="c" width="640" height="360" style="width:100vw;height:100vh;display:block"></canvas>
<script>
// A player that sits still until you click it (like most embedded players).
const g=document.getElementById('c').getContext('2d');let t=0,playing=false;
g.fillStyle='#222';g.fillRect(0,0,640,360);g.fillStyle='#fff';g.font='bold 34px sans-serif';g.fillText('▶ CLICK TO PLAY',170,190);
document.addEventListener('click',()=>{playing=true;parent.postMessage('clicked-play','*')});
setInterval(()=>{if(!playing)return;t++;g.fillStyle='#036';g.fillRect(0,0,640,360);g.fillStyle='#2fd17a';g.fillRect((t*9)%600,150,40,40);g.fillStyle='#fff';g.fillText('PLAYING '+t,200,90)},100);
</script></body></html>
