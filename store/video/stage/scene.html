<!doctype html>
<!-- An original, generated "show" for the film's demo player: a coastline at dusk. Rendered to
     show.webm by stage.py; nothing here is anyone else's footage. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
const c = document.getElementById('c'), g = c.getContext('2d'), W = 1280, H = 720;
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const ridge = (n, rough) => { const p = []; let y = 0; for (let i = 0; i <= n; i++) { y += (rnd() - 0.5) * rough; y *= 0.9; p.push(y); } return p; };
const layers = [
  { base: 0.56, amp: 60, rough: 70, col: ['#6d5a8c', '#8a6f9a'], speed: 4 },
  { base: 0.62, amp: 50, rough: 60, col: ['#4b3f6b', '#5d4a75'], speed: 9 },
  { base: 0.70, amp: 40, rough: 50, col: ['#2c2547', '#3a2f55'], speed: 18 },
].map(l => ({ ...l, pts: ridge(400, l.rough) }));
const clouds = Array.from({ length: 9 }, () => ({ x: rnd() * W * 1.5, y: 60 + rnd() * 220, w: 120 + rnd() * 260, s: 3 + rnd() * 6, a: 0.10 + rnd() * 0.18 }));
const birds = Array.from({ length: 5 }, (_, i) => ({ x: -80 - i * 46 - rnd() * 30, y: 210 + rnd() * 60, ph: rnd() * 6 }));
const stars = Array.from({ length: 70 }, () => [rnd() * W, rnd() * H * 0.35, rnd()]);

window.render = (t) => {
  const dusk = Math.min(1, t / 60);
  const sky = g.createLinearGradient(0, 0, 0, H * 0.75);
  sky.addColorStop(0, `hsl(${235 - dusk * 10},45%,${22 - dusk * 6}%)`);
  sky.addColorStop(0.45, `hsl(${280 - dusk * 20},40%,${42 - dusk * 8}%)`);
  sky.addColorStop(0.8, `hsl(${18 + dusk * 4},85%,${62 - dusk * 8}%)`);
  sky.addColorStop(1, `hsl(38,95%,${72 - dusk * 8}%)`);
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  for (const [x, y, b] of stars) { g.globalAlpha = Math.max(0, dusk * 0.9 - 0.2) * (0.4 + 0.6 * Math.abs(Math.sin(t * 1.3 + b * 9))); g.fillStyle = '#fff'; g.fillRect(x, y, 1.6, 1.6); }
  g.globalAlpha = 1;
  // the sun, setting
  const sx = W * 0.64, sy = H * 0.50 + dusk * 40;
  const halo = g.createRadialGradient(sx, sy, 10, sx, sy, 320);
  halo.addColorStop(0, 'rgba(255,214,150,.75)'); halo.addColorStop(1, 'rgba(255,140,90,0)');
  g.fillStyle = halo; g.fillRect(0, 0, W, H);
  g.fillStyle = '#ffe2b0'; g.beginPath(); g.arc(sx, sy, 46, 0, 7); g.fill();
  for (const cl of clouds) {
    const x = ((cl.x + t * cl.s) % (W + 600)) - 300;
    g.fillStyle = `rgba(255,200,190,${cl.a})`;
    g.beginPath(); g.ellipse(x, cl.y, cl.w, cl.w * 0.12, 0, 0, 7); g.fill();
  }
  // hills, drifting at their own depth
  for (const l of layers) {
    const off = t * l.speed, step = 6;
    const grad = g.createLinearGradient(0, H * l.base - l.amp, 0, H);
    grad.addColorStop(0, l.col[1]); grad.addColorStop(1, l.col[0]);
    g.fillStyle = grad; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + step; x += step) {
      const k = (x + off) / 28, i = Math.floor(k) % 400, f = (1 - Math.cos((k - Math.floor(k)) * Math.PI)) / 2;
      const y = l.pts[i] * (1 - f) + l.pts[(i + 1) % 400] * f;
      g.lineTo(x, H * l.base + y);
    }
    g.lineTo(W + step, H); g.fill();
  }
  // the sea, with the sun's path on it
  const seaTop = H * 0.76;
  const sea = g.createLinearGradient(0, seaTop, 0, H);
  sea.addColorStop(0, '#3b2d52'); sea.addColorStop(1, '#141024');
  g.fillStyle = sea; g.fillRect(0, seaTop, W, H - seaTop);
  for (let i = 0; i < 26; i++) {
    const y = seaTop + 6 + i * i * 0.28, w = 30 + i * 9 + Math.sin(t * 2 + i) * 14;
    g.fillStyle = `rgba(255,205,150,${0.55 - i * 0.02})`;
    g.fillRect(sx - w / 2 + Math.sin(t * 1.7 + i * 1.3) * 10, y, w, 2);
  }
  for (const b of birds) {
    const x = b.x + t * 38, y = b.y + Math.sin(t * 0.6 + b.ph) * 8, flap = Math.sin(t * 7 + b.ph) * 6;
    if (x < -20 || x > W + 20) continue;
    g.strokeStyle = 'rgba(30,20,40,.85)'; g.lineWidth = 2.2; g.beginPath();
    g.moveTo(x - 10, y - flap); g.quadraticCurveTo(x - 4, y - 2, x, y); g.quadraticCurveTo(x + 4, y - 2, x + 10, y - flap); g.stroke();
  }
  // a channel bug, the way a broadcast has one
  g.fillStyle = 'rgba(255,255,255,.82)'; g.font = '600 22px system-ui, sans-serif'; g.fillText('Coastlines', 46, 62);
  g.fillStyle = 'rgba(255,255,255,.6)'; g.font = '500 16px system-ui, sans-serif'; g.fillText('Episode 4 · The long evening', 46, 88);
};
window.ready = true;
</script></body></html>
